<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Checklist</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2 id="areaTitle"></h2>

<label>Turno:</label>
<select id="turno">
  <option value="">Seleccionar</option>
  <option>1</option>
  <option>2</option>
  <option>3</option>
</select>

<label>Empleado:</label>
<input type="text" id="empleado">

<h3>Checklist</h3>

<div class="question">
  <p>Equipo en buen estado</p>
  <button onclick="setAnswer('q1','SI')">SI</button>
  <button onclick="setAnswer('q1','NO')">NO</button>
</div>

<div class="question">
  <p>Área limpia</p>
  <button onclick="setAnswer('q2','SI')">SI</button>
  <button onclick="setAnswer('q2','NO')">NO</button>
</div>

<label>Observaciones:</label>
<textarea id="obs"></textarea>

<button onclick="enviar()">ENVIAR</button>

<p id="status"></p>

<script src="app.js"></script>
</body>
</html>
